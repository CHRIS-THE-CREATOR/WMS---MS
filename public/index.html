<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5W2H - Plano de Ação (WMS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-conteudo">
      <div class="logo">5W2H</div>
      <div>
        <h1>Plano de Ação</h1>
        <p class="subtitulo">Módulo de planejamento do WMS</p>
      </div>
    </div>
  </header>

  <main>
    <section class="formulario">
      <h2 id="form-titulo">Novo plano</h2>
      <form id="plano-form">
        <input type="hidden" id="plano-id" />

        <label>O quê? <span class="rotulo-en">(What)</span>
          <input type="text" id="o_que" required placeholder="Ex: Reorganizar o layout do estoque" />
        </label>

        <label>Por quê? <span class="rotulo-en">(Why)</span>
          <textarea id="por_que" placeholder="Motivo / objetivo"></textarea>
        </label>

        <div class="grid-2">
          <label>Onde? <span class="rotulo-en">(Where)</span>
            <input type="text" id="onde" placeholder="Ex: Armazém 3" />
          </label>
          <label>Quando? <span class="rotulo-en">(When)</span>
            <input type="date" id="quando" />
          </label>
        </div>

        <label>Quem? <span class="rotulo-en">(Who)</span>
          <input type="text" id="quem" placeholder="Responsável" />
        </label>

        <label>Como? <span class="rotulo-en">(How)</span>
          <textarea id="como" placeholder="Método / etapas"></textarea>
        </label>

        <label>Status
          <select id="status">
            <option value="pendente">Pendente</option>
            <option value="em_andamento">Em andamento</option>
            <option value="concluido">Concluído</option>
          </select>
        </label>

        <div class="acoes-form">
          <button type="submit" id="salvar-btn">Salvar</button>
          <button type="button" id="cancelar-btn" class="secundario" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="lista">
      <h2>Planos cadastrados</h2>
      <div id="planos-lista" class="cards"></div>
    </section>
  </main>
</body>
<script src="app.js"></script>
</html>

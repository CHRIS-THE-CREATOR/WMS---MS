<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5W2H - Plano de Ação (WMS)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>5W2H — Plano de Ação</h1>
    <p class="subtitulo">Módulo de planejamento do WMS</p>
  </header>

  <main>
    <section class="formulario">
      <h2 id="form-titulo">Novo plano</h2>
      <form id="plano-form">
        <input type="hidden" id="plano-id" />

        <label>O quê? (What) *
          <input type="text" id="o_que" required placeholder="Ex: Reorganizar o layout do estoque" />
        </label>

        <label>Por quê? (Why)
          <textarea id="por_que" placeholder="Motivo / objetivo"></textarea>
        </label>

        <div class="grid-2">
          <label>Onde? (Where)
            <input type="text" id="onde" placeholder="Ex: Armazém 3" />
          </label>
          <label>Quando? (When)
            <input type="date" id="quando" />
          </label>
        </div>

        <div class="grid-2">
          <label>Quem? (Who)
            <input type="text" id="quem" placeholder="Responsável" />
          </label>
          <label>Quanto custa? (How much)
            <input type="text" id="quanto_custa" placeholder="Ex: R$ 1.500,00" />
          </label>
        </div>

        <label>Como? (How)
          <textarea id="como" placeholder="Método / etapas"></textarea>
        </label>

        <label>Status
          <select id="status">
            <option value="pendente">Pendente</option>
            <option value="em_andamento">Em andamento</option>
            <option value="concluido">Concluído</option>
          </select>
        </label>

        <div class="acoes-form">
          <button type="submit" id="salvar-btn">Salvar</button>
          <button type="button" id="cancelar-btn" class="secundario" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="lista">
      <h2>Planos cadastrados</h2>
      <div id="planos-lista" class="cards"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
